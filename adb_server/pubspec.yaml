name: adb_server
description: >
  Control-plane server for a Flutter/Dart performance-benchmarking rig.
  Drives an Android device over ADB and stores raw results as plain files.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2

executables:
  adb_server: server

dependencies:
  args: ^2.1.1
  crypto: ^3.0.3
  freezed_annotation: ^3.0.0
  http: ^1.6.0
  jaspr: ^0.23.3
  jaspr_router: ^0.9.0
  json_annotation: ^4.12.0
  logging: ^1.0.1
  path: ^1.8.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  freezed: ^3.0.0
  jaspr_builder: ^0.23.3
  json_serializable: ^6.9.4
  lints: ^5.0.0
  test: ^1.16.0

jaspr:
  mode: server
