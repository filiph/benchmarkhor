name: adb_server
description: >
  Control-plane server for a Flutter/Dart performance-benchmarking rig.
  Drives an Android device over ADB and stores raw results as plain files.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

executables:
  adb_server: server

dependencies:
  args: ^2.1.1
  crypto: ^3.0.3
  logging: ^1.0.1
  path: ^1.8.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.16.0
