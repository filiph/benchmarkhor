services:
  adb_server:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: adb_server:local
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # NOTE: network_mode: host is generally required for the Synology NAS deployment
    # to access the local network, but it DOES NOT work on Docker Desktop for Mac
    # (it connects to the Docker VM, not your Mac host). Use bridge mode (default) on Mac.
    # network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/data
      - adb_key:/root/.android
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  adb_key:
